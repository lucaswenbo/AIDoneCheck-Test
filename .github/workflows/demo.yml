name: AIDoneCheck 发布版演示
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  demo:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: healthy
            title: 健康项目通过
          - scenario: no-tests
            title: 缺少真实测试的警告
          - scenario: test-failure
            title: 真实断言失败被阻断
          - scenario: pageerror
            title: 浏览器页面错误被阻断
          - scenario: resource-overflow
            title: 记录上限之外的关键失败被阻断
          - scenario: unsafe-path
            title: 脚本创建越界路径被拒绝
    env:
      DEMO_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: 启动本地浏览器测试服务（不访问生产网站）
        if: matrix.scenario == 'pageerror' || matrix.scenario == 'resource-overflow'
        run: |
          node scripts/fixture-server.mjs 0 "$RUNNER_TEMP/aidonecheck-demo-url" > "$RUNNER_TEMP/aidonecheck-demo-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aidonecheck-demo-pid"
      - name: 创建独立 Git 项目和真实故障（不改产品仓库）
        run: node scripts/demo-fixture.mjs
      - name: 安装演示项目的 TypeScript（Action 自身无需 npm ci）
        working-directory: .demo
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 运行固定发布版本 AIDoneCheck v1.0.2
        id: verify
        continue-on-error: true
        uses: lucaswenbo/AIDoneCheck@v1.0.2
        with:
          working-directory: .demo
          base: main
      - name: 断言实际结论、失败原因和证据
        if: always()
        env:
          EVIDENCE_DIR: ${{ steps.verify.outputs.evidence_dir }}
          EVIDENCE_NAME: ${{ steps.verify.outputs.evidence_name }}
          ARTIFACT_ID: ${{ steps.verify.outputs.artifact_id }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
          ACTION_OUTCOME: ${{ steps.verify.outcome }}
        run: node scripts/assert-demo.mjs
      - name: 从 GitHub 下载本场景证据产物
        if: always() && steps.verify.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/demo-downloaded
          merge-multiple: true
      - name: 核对下载文件与原始证据 完全一致
        if: always() && steps.verify.outputs.artifact_id != ''
        env:
          EVIDENCE_DIR: ${{ steps.verify.outputs.evidence_dir }}
          DOWNLOADED: ${{ runner.temp }}/demo-downloaded
        run: node scripts/verify-demo-download.mjs
      - name: 停止本地测试服务
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/aidonecheck-demo-pid"; then
            kill "$(cat "$RUNNER_TEMP/aidonecheck-demo-pid")" || true
          fi
